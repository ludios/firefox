<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; img-src data: moz-remote-image:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="about-processes-title"></title>
    <link
      rel="icon"
      id="favicon"
      href="chrome://global/skin/icons/performance.svg"
    />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="localization" href="toolkit/about/aboutProcesses.ftl" />
    <link rel="localization" href="branding/brand.ftl" />
    <script src="chrome://global/content/customElements.js"></script>
    <script src="chrome://global/content/aboutProcesses.js"></script>
    <script
      type="module"
      src="chrome://global/content/elements/panel-list.mjs"
    ></script>
    <link rel="stylesheet" href="chrome://global/content/aboutProcesses.css" />
  </head>
  <body>
    <div id="tab-search-bar">
      <moz-input-search
        id="tab-search-input"
        data-l10n-id="about-processes-search-tabs"
        data-l10n-attrs="placeholder,aria-label"
      ></moz-input-search>
    </div>
    <table id="process-table">
      <thead id="process-thead">
        <tr>
          <th class="select-cell">
            <input
              type="checkbox"
              id="select-all-checkbox"
              class="select-checkbox"
              data-l10n-id="about-processes-select-all-tabs"
            />
          </th>
          <th class="clickable-header">
            <button
              id="expand-all-button"
              class="ghost-button icon-button"
              data-l10n-id="about-processes-expand-all-sites"
            ></button>
            <button
              class="clickable"
              id="column-name"
              aria-sort="none"
              data-l10n-id="about-processes-column-name"
            ></button>
          </th>
          <th class="clickable-header">
            <button
              class="clickable"
              id="column-memory-resident"
              data-l10n-id="about-processes-column-memory-resident"
              aria-sort="none"
            ></button>
          </th>
          <!-- Memory usage. -->
          <th class="clickable-header">
            <button
              class="clickable"
              id="column-cpu-total"
              data-l10n-id="about-processes-column-cpu-total"
              aria-sort="none"
            ></button>
          </th>
          <!--CPU time-->
          <th class="clickable-header optional-column wakeups">
            <button
              class="clickable"
              id="column-wakeups"
              data-l10n-id="about-processes-column-wakeups"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column cpu-wait">
            <button
              class="clickable"
              id="column-cpu-wait"
              data-l10n-id="about-processes-column-cpu-wait"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column shared-memory">
            <button
              class="clickable"
              id="column-shared-memory"
              data-l10n-id="about-processes-column-shared-memory"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column peak-memory">
            <button
              class="clickable"
              id="column-peak-memory"
              data-l10n-id="about-processes-column-peak-memory"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column swap">
            <button
              class="clickable"
              id="column-swap"
              data-l10n-id="about-processes-column-swap"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column disk-read">
            <button
              class="clickable"
              id="column-disk-read"
              data-l10n-id="about-processes-column-disk-read"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column disk-write">
            <button
              class="clickable"
              id="column-disk-write"
              data-l10n-id="about-processes-column-disk-write"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column major-faults">
            <button
              class="clickable"
              id="column-major-faults"
              data-l10n-id="about-processes-column-major-faults"
              aria-sort="none"
            ></button>
          </th>
          <th class="clickable-header optional-column uptime">
            <button
              class="clickable"
              id="column-uptime"
              data-l10n-id="about-processes-column-uptime"
              aria-sort="none"
            ></button>
          </th>
          <th id="column-kill" data-l10n-id="about-processes-column-action">
            <button
              id="column-options-button"
              aria-haspopup="menu"
              data-l10n-id="about-processes-column-options-button"
              hidden
            ></button>
          </th>
          <!-- Kill button. -->
        </tr>
      </thead>
      <tbody id="process-tbody"></tbody>
      <tbody id="tab-search-status">
        <tr>
          <td id="tab-search-no-results" role="status"></td>
        </tr>
      </tbody>
      <tfoot id="process-tfoot">
        <tr class="bulk-summary-row">
          <td class="select-cell">
            <button
              id="bulk-cancel-button"
              class="ghost-button icon-button"
              data-l10n-id="about-processes-bulk-cancel-selection"
            ></button>
          </td>
          <td class="bulk-count"></td>
          <td class="memory"></td>
          <td class="cpu"></td>
        </tr>
        <tr class="bulk-buttons-row">
          <td colspan="5">
            <moz-button-group>
              <moz-button
                id="bulk-unload-button"
                size="small"
                data-l10n-id="about-processes-bulk-unload-tabs"
              ></moz-button>
              <moz-button
                id="bulk-reload-button"
                size="small"
                data-l10n-id="about-processes-bulk-reload-tabs"
              ></moz-button>
              <moz-button
                id="bulk-close-button"
                size="small"
                data-l10n-id="about-processes-bulk-close-tabs"
              ></moz-button>
            </moz-button-group>
          </td>
        </tr>
        <tr class="totals-row">
          <td class="totals-count"></td>
          <td class="memory"></td>
          <td class="cpu"></td>
        </tr>
      </tfoot>
    </table>
    <panel-list id="column-options-menu">
      <panel-item
        type="checkbox"
        data-column="wakeups"
        data-l10n-id="about-processes-column-wakeups"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="cpu-wait"
        data-l10n-id="about-processes-column-cpu-wait"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="shared-memory"
        data-l10n-id="about-processes-column-shared-memory"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="peak-memory"
        data-l10n-id="about-processes-column-peak-memory"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="swap"
        data-l10n-id="about-processes-column-swap"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="disk-read"
        data-l10n-id="about-processes-column-disk-read"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="disk-write"
        data-l10n-id="about-processes-column-disk-write"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="major-faults"
        data-l10n-id="about-processes-column-major-faults"
      ></panel-item>
      <panel-item
        type="checkbox"
        data-column="uptime"
        data-l10n-id="about-processes-column-uptime"
      ></panel-item>
    </panel-list>
  </body>
</html>
